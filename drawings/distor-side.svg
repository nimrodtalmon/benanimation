<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
  <!-- "Distor" character, side view (facing left), drawn from Ben's front drawing.
       Every part is its own group, so it can be animated directly. -->
  <defs>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="marker" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.06" numOctaves="3" seed="9"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="shirtClip"><polygon points="470,1110 545,1150 515,1600 440,1600"/></clipPath>
  </defs>
  <style>
    .ink { stroke:#121212; stroke-width:7; stroke-linejoin:round; stroke-linecap:round; }
    .line { fill:none; stroke:#121212; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
  </style>

  <rect id="bg" width="1200" height="1600" fill="#eee7da"/>

  <g id="figure">
    <!-- head + neck skin -->
    <g id="head-skin">
      <path class="ink" fill="#f3c9a0" d="
        M 430 300 L 418 470 Q 412 540 425 565 L 418 582 L 405 612 L 352 715
        Q 335 740 350 755 Q 365 764 385 760 Q 400 752 410 760 L 403 772
        Q 392 790 398 805 L 393 813 Q 397 828 402 835 Q 386 860 388 885 Q 392 930 420 942
        L 470 946 L 478 1000 Q 494 1028 483 1050 L 495 1180 L 800 1180 L 785 900
        Q 880 700 870 500 Q 850 300 650 262 Q 500 250 430 300 Z"/>
      <!-- shade under the jaw -->
      <path fill="#dca478" opacity="0.55" d="M 426 946 L 600 910 L 655 795 L 790 880 L 800 1180 L 495 1180 L 483 1050 Q 494 1028 478 1000 L 470 946 Z"/>
      <path class="line" d="M 424 942 L 600 908 L 652 792"/>
      <!-- neck tendons -->
      <path class="line" d="M 560 960 Q 575 1040 560 1090"/>
      <path class="line" d="M 700 930 Q 690 1010 712 1080"/>
    </g>

    <!-- face details -->
    <g id="face">
      <path id="nostril" class="line" d="M 384 746 Q 396 736 404 750"/>
      <path id="mouth" class="line" d="M 394 813 L 432 817"/>
      <path id="cheek" class="line" d="M 482 640 Q 472 720 436 792"/>
      <g id="eye">
        <path fill="#e7e5ec" d="M 424 578 Q 470 556 522 566 L 516 606 Q 470 614 432 604 Z"/>
        <path fill="#c9c3d3" d="M 426 579 Q 470 559 520 568 L 518 586 Q 470 580 430 592 Z"/>
        <path d="M 436 610 Q 475 620 515 607" fill="none" stroke="#5b2c7d" stroke-width="9" stroke-linecap="round"/>
        <path class="line" d="M 432 617 Q 475 629 520 612"/>
        <path id="lid" d="M 418 576 Q 468 548 528 563" fill="none" stroke="#121212" stroke-width="12" stroke-linecap="round"/>
      </g>
      <g id="tears" stroke="#c4122f" stroke-linecap="round" fill="none">
        <path d="M 440 620 C 446 660 449 705 452 770" stroke-width="9"/>
        <path d="M 458 624 C 463 650 463 670 465 694" stroke-width="6"/>
        <circle cx="452" cy="776" r="6" fill="#c4122f" stroke="none"/>
      </g>
    </g>

    <!-- hair: messy brown, fringe down to the eyes, sideburn in front of the ear -->
    <g id="hair">
      <path class="ink" fill="#7a4a2c" d="M 418 520 Q 420 480 445 470 Q 450 520 462 545 Q 470 500 490 485 Q 500 530 515 555
        Q 525 505 545 495 Q 560 540 570 565 Q 585 520 600 510 Q 625 580 635 640 Q 640 700 645 770
        Q 665 700 668 640 Q 670 600 680 575 Q 720 570 745 585 Q 785 610 795 650 Q 800 710 805 765
        Q 820 720 832 705 Q 845 770 850 830 Q 865 760 870 712 Q 885 740 890 772 Q 895 690 888 620
        Q 915 560 905 480 Q 935 440 915 400 Q 925 345 895 330 Q 920 300 905 270 Q 880 240 855 255
        Q 860 215 830 205 Q 805 195 795 220 Q 790 175 755 175 Q 725 180 725 205 Q 705 160 670 175
        Q 650 190 655 215 Q 620 180 590 195 Q 570 210 580 235 Q 545 205 515 225 Q 500 240 512 262
        Q 470 245 450 270 Q 445 290 465 300 Q 420 300 405 330 Q 400 355 425 362 Q 385 380 388 410
        Q 395 435 425 432 Q 400 460 410 480 Q 405 500 418 520 Z"/>
      <!-- dark strands -->
      <g class="line" stroke-width="6">
        <path d="M 470 300 Q 520 380 520 470"/>
        <path d="M 590 250 Q 640 340 610 470"/>
        <path d="M 700 230 Q 760 330 720 470"/>
        <path d="M 800 300 Q 840 420 810 560"/>
        <path d="M 640 520 Q 660 470 700 450"/>
      </g>
      <path fill="#4b2b19" opacity="0.6" d="M 625 600 Q 640 700 645 770 Q 665 700 668 640 Q 670 600 680 575 L 700 530 L 640 540 Z"/>
      <!-- light streaks -->
      <g fill="none" stroke="#ece0c8" stroke-width="7" stroke-linecap="round">
        <path d="M 520 300 Q 550 340 552 390"/>
        <path d="M 660 280 Q 690 320 688 370"/>
        <path d="M 770 330 Q 795 370 790 420"/>
        <path d="M 455 400 Q 470 420 468 450"/>
      </g>
    </g>

    <!-- ear sticks out, in front of the hair -->
    <g id="ear">
      <path class="ink" fill="#f3c9a0" d="M 668 640 Q 690 590 742 600 Q 792 615 787 682 Q 783 742 746 772 Q 715 792 690 772 Q 674 760 679 744 Z"/>
      <path class="line" d="M 700 652 Q 742 640 752 686 Q 750 722 726 738"/>
      <path fill="#dca478" opacity="0.6" d="M 700 652 Q 742 640 752 686 Q 750 722 726 738 Q 712 700 700 652 Z"/>
    </g>

    <!-- shirt: black with red/grey flames -->
    <g id="shirt">
      <polygon class="ink" fill="#1b1b1d" points="470,1110 545,1150 515,1600 440,1600"/>
      <g clip-path="url(#shirtClip)">
        <path fill="#5a5f68" d="M 440 1150 L 470 1185 L 480 1150 L 505 1200 L 515 1160 L 545 1215 L 545 1290 L 440 1290 Z"/>
        <path fill="#cf1a2c" d="M 440 1200 L 462 1240 L 475 1205 L 492 1262 L 510 1220 L 520 1275 L 545 1250 L 545 1320 L 440 1320 Z"/>
        <path fill="#1b1b1d" d="M 440 1300 L 470 1270 L 488 1310 L 505 1280 L 525 1315 L 545 1300 L 545 1340 L 440 1340 Z"/>
        <text x="446" y="1500" font-family="Impact, 'Arial Black', sans-serif" font-size="120" fill="#cf1a2c" transform="rotate(-3 470 1460)">D</text>
      </g>
    </g>

    <!-- white jacket with stand-up collar -->
    <g id="jacket">
      <path class="ink" fill="#f6f4ef" d="M 540 1150 L 830 1105 Q 960 1118 1022 1180 Q 1064 1250 1066 1600 L 515 1600 Z"/>
      <path fill="#dcd8d0" opacity="0.8" d="M 860 1112 Q 960 1120 1022 1180 Q 1064 1250 1066 1600 L 900 1600 Q 930 1350 860 1112 Z"/>
      <path class="line" d="M 880 1120 Q 935 1330 912 1600"/>
      <g id="collar">
        <path class="ink" fill="#f6f4ef" d="M 495 1095 L 810 1040 L 835 1110 L 540 1158 Z"/>
        <path fill="#a5a8b5" d="M 498 1098 L 808 1044 L 812 1062 L 503 1115 Z"/>
        <path class="line" d="M 501 1114 L 812 1060"/>
      </g>
      <g id="buttons" class="ink" stroke-width="4" fill="#e3b21f">
        <circle cx="572" cy="1212" r="12"/>
        <circle cx="556" cy="1520" r="12"/>
      </g>
    </g>
  </g>

  <rect width="1200" height="1600" filter="url(#paper)" opacity="0.08" style="mix-blend-mode:multiply"/>
</svg>
