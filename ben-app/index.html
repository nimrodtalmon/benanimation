<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ben's band — drawing kit</title>
<style>
  :root { --ink:#1b1714; --paper:#f4efe6; --muted:#7d746a; --ok:#2f8a4a; --accent:#b3132e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--paper); color:var(--ink); }
  main { max-width: 640px; margin: 0 auto; padding: 18px 14px 110px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  h1 { font-size: 22px; margin: 0; }
  .lang button { border:1px solid var(--ink); background:none; padding:4px 9px; font-size:14px; cursor:pointer; }
  .lang button.on, .chars button.on { background:var(--ink); color:var(--paper); }
  .chars { display:flex; gap:6px; margin-top: 12px; }
  .chars button { flex:1; border:1px solid var(--ink); background:none; padding:7px 4px; font-size:15px; cursor:pointer; }
  .tips { margin: 12px 0; font-size: 14px; line-height: 1.45; color: var(--muted); }
  .bar { height: 8px; background: #e2dacb; margin: 6px 0 4px; }
  .bar div { height: 100%; background: var(--ok); width: 0; transition: width .3s; }
  .count { font-size: 13px; color: var(--muted); }
  .list { max-height: 62vh; overflow-y: auto; border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink); margin-top: 10px; }
  .row { display:grid; grid-template-columns: 56px 1fr 64px; gap: 12px; align-items:center; padding: 10px 2px; border-bottom: 1px solid #ddd3c2; }
  .row:last-child { border-bottom: none; }
  .row svg { width:56px; height:56px; }
  .t { font-weight: 600; font-size: 15px; }
  .d { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .slot { width:64px; height:64px; border: 2px dashed #c7bca9; display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative; overflow:hidden; background:#fff; }
  .slot img { width:100%; height:100%; object-fit:cover; }
  .slot span { font-size: 26px; color:#b6aa95; }
  .slot.done { border: 2px solid var(--ok); }
  .slot.busy::after { content:""; position:absolute; inset:0; background:rgba(255,255,255,.7); }
  .slot input { display:none; }
  footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--paper); border-top: 2px solid var(--ink); padding: 12px 14px; }
  footer .in { max-width: 640px; margin: 0 auto; display:flex; gap:10px; align-items:center; justify-content:space-between; }
  footer button { background: var(--ink); color: var(--paper); border: none; padding: 10px 14px; font-size: 15px; cursor: pointer; }
  footer .msg { font-size: 13px; color: var(--muted); }
  [dir=rtl] .row { direction: rtl; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title"></h1>
    <div class="lang"><button data-l="en">EN</button><button data-l="he">עב</button></div>
  </header>
  <div class="chars" id="chars"></div>
  <div class="tips" id="tips"></div>
  <div class="bar"><div id="bar"></div></div>
  <div class="count" id="count"></div>
  <div class="list" id="list"></div>
</main>
<footer><div class="in"><span class="msg" id="msg"></span><button id="done"></button></div></footer>

<script>
let CHAR = localStorage.getItem("benchar") || "singer";
const S = 'stroke="#1b1714" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"';
const ICON = {
  head: `<svg viewBox="0 0 56 56"><path ${S} d="M14 26 Q12 6 28 6 Q44 6 42 26 Q42 46 28 50 Q14 46 14 26Z"/><path ${S} d="M14 22 Q20 10 28 16 Q36 8 42 22"/><circle cx="22" cy="28" r="2.5" fill="#1b1714"/><circle cx="34" cy="28" r="2.5" fill="#1b1714"/><path ${S} d="M23 40 L33 40"/></svg>`,
  body: `<svg viewBox="0 0 56 56"><path ${S} d="M24 4 L24 12 L10 16 L12 52 L44 52 L46 16 L32 12 L32 4"/><path ${S} d="M28 14 L28 52"/></svg>`,
  "upper-arm": `<svg viewBox="0 0 56 56"><rect ${S} x="20" y="4" width="16" height="48" rx="8"/><circle cx="28" cy="12" r="2" fill="#b3132e"/><circle cx="28" cy="44" r="2" fill="#b3132e"/></svg>`,
  "forearm-hand": `<svg viewBox="0 0 56 56"><rect ${S} x="21" y="2" width="14" height="32" rx="7"/><path ${S} d="M19 34 Q16 48 28 49 Q40 48 37 34Z"/><path ${S} d="M22 40 L33 40 M22 45 L33 45"/></svg>`,
  leg: `<svg viewBox="0 0 56 56"><rect ${S} x="20" y="2" width="16" height="40" rx="8"/><path ${S} d="M20 40 L20 52 L46 52 Q46 44 36 42"/></svg>`,
};
const PARTS = [
  ["head", "Head", "Front view, with the neck. Eyes open, mouth closed (the computer opens the mouth and closes the eyes). Hair, ears, hat if any.", "ראש", "מלפנים, עם הצוואר. עיניים פתוחות, פה סגור (המחשב כבר פותח את הפה ועוצם את העיניים). עם שיער ואוזניים, וכובע אם יש."],
  ["body", "Body", "Front view, shoulders to hips, with the clothes. No arms, no head. Keep the whole body on the page (nothing running off the edge).", "גוף", "מלפנים, מהכתפיים עד המותניים, עם הבגדים. בלי ידיים ובלי ראש. כל הגוף בתוך הדף (שום דבר לא נחתך בקצה)."],
  ["upper-arm", "Upper arm", "Shoulder to elbow, in the sleeve, hanging straight down. Round ends.", "זרוע עליונה", "מהכתף עד המרפק, עם השרוול, ישר כלפי מטה. קצוות עגולים."],
  ["forearm-hand", "Forearm + hand", "Elbow to fingers, straight down. Hand in a loose fist, as if holding a stick (it will hold the mic, drumsticks or a pick). Round end at the elbow.", "אמה + כף יד", "מהמרפק עד האצבעות, ישר כלפי מטה. כף היד אגרוף רפוי, כאילו מחזיקה מקל (היא תחזיק מיקרופון, מקלות תופים או מפרט). קצה עגול במרפק."],
  ["leg", "Leg (optional)", "Hip to shoe, straight, shoe pointing sideways. Only if the character's legs show.", "רגל (לא חובה)", "מהמותן עד הנעל, ישרה, הנעל פונה הצידה. רק אם רואים את הרגליים של הדמות."],
];
const CHARS = [["singer", "Singer", "זמר"], ["guitarist", "Guitarist", "גיטריסט"], ["drummer", "Drummer", "מתופף"]];
const TXT = {
  en: { title: "Ben's band", tips: "One part per page · white paper, closed black outlines, color as usual · all parts at the same size (the head about as big as your hand) · arms straight, round ends where parts join · the computer bends the arms and moves the face · photo from straight above, good light, the whole page in the picture.", count: (n, m) => `${n} of ${m} parts`, done: "Done → Claude", copied: "Copied. Paste it to Claude.", nokey: "This link is missing its key." },
  he: { title: "הלהקה של בן", tips: "חלק אחד בכל דף · דף לבן, קווי מתאר שחורים וסגורים, צביעה כרגיל · כל החלקים באותו גודל (הראש בערך בגודל כף היד) · ידיים ישרות, קצוות עגולים איפה שחלקים מתחברים · המחשב מכופף את הידיים ומזיז את הפנים · צילום מלמעלה, באור טוב, כל הדף בתמונה.", count: (n, m) => `${n} מתוך ${m} חלקים`, done: "סיימתי ← Claude", copied: "הועתק. להדביק ל-Claude.", nokey: "חסר מפתח בקישור." },
};
const key = new URLSearchParams(location.search).get("k") || "";
let lang = localStorage.getItem("benlang") || "en";
let state = {};

function render() {
  const T = TXT[lang];
  document.documentElement.lang = lang;
  document.body.dir = lang === "he" ? "rtl" : "ltr";
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
  document.getElementById("title").textContent = T.title;
  const ch = document.getElementById("chars");
  ch.innerHTML = "";
  CHARS.forEach(([id, en, he]) => {
    const b = document.createElement("button");
    b.textContent = lang === "he" ? he : en;
    b.classList.toggle("on", id === CHAR);
    b.addEventListener("click", () => { CHAR = id; localStorage.setItem("benchar", id); render(); });
    ch.appendChild(b);
  });
  document.getElementById("tips").textContent = T.tips;
  document.getElementById("done").textContent = T.done;
  const have = state[CHAR] || {};
  const n = PARTS.filter(p => have[p[0]]).length;
  document.getElementById("count").textContent = T.count(n, PARTS.length);
  document.getElementById("bar").style.width = (100 * n / PARTS.length) + "%";
  document.getElementById("msg").textContent = key ? "" : T.nokey;
  const list = document.getElementById("list");
  list.innerHTML = "";
  PARTS.forEach(([id, en, enD, he, heD], i) => {
    const row = document.createElement("div");
    row.className = "row";
    const got = have[id];
    row.innerHTML = `${ICON[id]}<div><div class="t">${i + 1}. ${lang === "he" ? he : en}</div><div class="d">${lang === "he" ? heD : enD}</div></div>
      <label class="slot ${got ? "done" : ""}">${got ? `<img src="files/${CHAR}/${id}.jpg?k=${encodeURIComponent(key)}&t=${got.t}">` : "<span>📷</span>"}<input type="file" accept="image/*"></label>`;
    row.querySelector("input").addEventListener("change", e => upload(id, e.target.files[0], row.querySelector(".slot")));
    list.appendChild(row);
  });
}

async function load() {
  if (!key) return render();
  const r = await fetch(`api/state?k=${encodeURIComponent(key)}`);
  if (r.ok) state = await r.json();
  render();
}

async function upload(part, file, slot) {
  if (!file) return;
  slot.classList.add("busy");
  // shrink on the phone before sending (max 2400 px, JPEG)
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, 2400 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise(res => c.toBlob(res, "image/jpeg", 0.9));
  const r = await fetch(`api/upload/${CHAR}/${part}?k=${encodeURIComponent(key)}`, { method: "POST", headers: { "Content-Type": "image/jpeg" }, body: blob });
  slot.classList.remove("busy");
  if (!r.ok) { alert("Upload failed: " + r.status); return; }
  await load();
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => { lang = b.dataset.l; localStorage.setItem("benlang", lang); render(); }));
document.getElementById("done").addEventListener("click", async () => {
  const text = `Ben uploaded drawings for the ${CHAR} in the drawing kit: ${location.origin}${location.pathname}?k=${key} — please cut them out, put them into the ${CHAR} warp puppet in the benanimation repo (puppet/band.py), and render a short test.`;
  try { await navigator.clipboard.writeText(text); document.getElementById("msg").textContent = TXT[lang].copied; } catch (e) {}
  window.open("https://claude.ai/new", "_blank");
});
load();
</script>
</body>
</html>
